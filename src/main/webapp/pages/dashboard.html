<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - LuxeSalon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            max-width: var(--container-max);
            margin: 0 auto;
            padding: calc(var(--nav-height) + 2rem) 2rem 4rem;
        }
        
        .profile-sidebar {
            position: sticky;
            top: calc(var(--nav-height) + 2rem);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #000 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #fff;
            margin: 0 auto 1.5rem;
            border: 2px solid var(--border-light);
        }

        .tab-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .tab-btn {
            padding: 0.8rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
            transition: all var(--transition-fast);
        }

        .tab-btn:hover, .tab-btn.active {
            background: rgba(201, 164, 115, 0.1);
            color: var(--primary);
        }

        .content-panel {
            display: none;
            animation: fadeIn 0.4s var(--transition-base);
        }
        .content-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .appointment-card {
            border: 1px solid var(--border-light);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20,20,24,0.4);
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-upcoming { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .status-completed { background: rgba(52, 211, 153, 0.1); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    </style>
</head>
<body>
    <nav class="navbar glass">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">&#10024;</span> LuxeSalon
            </a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="booking.html" class="btn-primary">Book New</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="profile-sidebar glass-card fade-in-up">
            <div class="avatar" id="userAvatar">U</div>
            <h3 id="userFullName" style="text-align: center; margin-bottom: 0.2rem;">Loading...</h3>
            <p id="userEmail" style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">Loading...</p>
            
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('history')">Appointment History</button>
                <button class="tab-btn" onclick="switchTab('profile')">Profile Settings</button>
                <button class="tab-btn" style="color: #ef4444; margin-top: 1rem;" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="dashboard-content fade-in-up delay-1">
            
            <!-- Active Token Card (Smart Salon) -->
            <div id="activeTokenSection" class="glass-card fade-in-up" style="display: none; border: 1px solid var(--primary); background: rgba(201, 164, 115, 0.05); margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <div>
                        <div class="badge">Active Appointment</div>
                        <h2 style="margin-top: 0.5rem;">Live Queue Status</h2>
                    </div>
                    <div class="now-serving-badge" id="tokenLabel">TK-000</div>
                </div>
                
                <div class="token-container" style="padding: 1.5rem; border-style: solid; border-width: 1px;">
                    <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">YOUR NUMBER</div>
                    <div class="token-number" id="userToken" style="font-size: 3rem;">...</div>
                    <div id="userStatusLabel" class="status-badge status-upcoming" style="margin-top: 1rem; display: inline-block;">WAITING</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; text-align: center;">
                    <div class="glass-card" style="padding: 1rem;">
                        <div style="font-size: 0.8rem; color: var(--text-muted);">POSITION</div>
                        <div id="userPosition" style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">--</div>
                    </div>
                    <div class="glass-card" style="padding: 1rem;">
                        <div style="font-size: 0.8rem; color: var(--text-muted);">EST. WAIT</div>
                        <div id="userWait" style="font-size: 1.5rem; font-weight: 700; color: var(--secondary);">-- mins</div>
                    </div>
                </div>

                <div id="servingNow" class="ai-suggestion" style="margin-top: 1.5rem; text-align: center;">
                    📢 Now Serving Token: <strong id="nowServingVal">...</strong>
                </div>
            </div>

            <!-- History Tab -->
            <div id="history" class="content-panel active glass-card">
                <h2 style="margin-bottom: 2rem;">Appointment History</h2>
                <div id="historyList">
                    <p style="color: var(--text-muted); text-align: center; padding: 2rem;">Loading history...</p>
                </div>
            </div>

            <!-- Profile Tab -->
            <div id="profile" class="content-panel glass-card">
                <h2 style="margin-bottom: 2rem;">Profile Details</h2>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profName" class="form-control" >
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="profEmail" class="form-control" >
                    </div>
                    <button type="button" class="btn-primary" onclick="saveProfile()" style="margin-top:1rem;">Save</button>
            </div>

        </div>
    </div>

    <script>
    // Fetch appointment history and render it
    async function loadHistory() {
        try {
            const response = await fetch('/api/history');
            console.log('History response status:', response.status);
            if (response.status === 401) {
                document.getElementById('historyList').innerHTML = '<p style="color: var(--text-muted); text-align:center;">Please log in to view history.</p>';
                return;
            }
            const data = await response.json();
            console.log('History data:', data);
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (data.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted); text-align:center;">No appointments found.</p>';
                return;
            }
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'appointment-card glass-card';
                div.innerHTML = `
                    <div>
                        <strong>Token:</strong> ${item.tokenNumber || item.token || ''}<br/>
                        <strong>Date:</strong> ${item.appointmentDate || ''} ${item.appointmentTime || ''}<br/>
                        <strong>Status:</strong> ${item.status || ''}
                    </div>`;
                list.appendChild(div);
            });
        } catch (err) {
            console.error('History load error', err);
        }
    }

    // Load user profile and populate sidebar and profile form
    async function loadProfile() {
        try {
            const response = await fetch('/api/profile');
            if (response.status === 401) {
                // Not logged in; redirect to login
                window.location.href = 'login.html';
                return;
            }
            const data = await response.json();
            // Update sidebar name and email
            const userName = data.fullName || data.name || 'User';
            const nameElem = document.getElementById('userFullName');
            if (nameElem) nameElem.textContent = userName;
            const avatarElem = document.getElementById('userAvatar');
            if (avatarElem) avatarElem.textContent = userName.charAt(0).toUpperCase();
            const emailElem = document.getElementById('userEmail');
            if (emailElem) emailElem.textContent = data.email || '';
            // Populate profile form fields
            const nameInput = document.getElementById('profName');
            if (nameInput) nameInput.value = data.fullName || data.name || '';
            const emailInput = document.getElementById('profEmail');
            if (emailInput) emailInput.value = data.email || '';
        } catch (err) {
            console.error('Profile load error', err);
        }
    }

    // Load dashboard data (queue status) and then load history and profile
    async function loadDashboard() {
        try {
            const response = await fetch('/api/queue');
            const data = await response.json();

            if (data.status === 'error' && data.message === 'Unauthorized') {
                window.location.href = 'login.html';
                return;
            }

            // Update Active Token Section
            if (data.myStatus) {
                document.getElementById('activeTokenSection').style.display = 'block';
                document.getElementById('userToken').textContent = data.myStatus.token;
                document.getElementById('tokenLabel').textContent = data.myStatus.token;
                document.getElementById('userStatusLabel').textContent = data.myStatus.status.toUpperCase();
                document.getElementById('userPosition').textContent = data.myStatus.position;
                document.getElementById('userWait').textContent = data.myStatus.waitTime + ' mins';
                document.getElementById('nowServingVal').textContent = data.nowServing;

                if (data.myStatus.status === 'serving') {
                    document.getElementById('userStatusLabel').className = 'status-badge status-completed';
                    document.getElementById('userStatusLabel').textContent = 'NOW SERVING';
                }
            } else {
                document.getElementById('activeTokenSection').style.display = 'none';
            }

            // Load appointment history after queue info
            loadHistory();
            // Load user profile
            loadProfile();
        } catch (err) {
            console.error(err);
        }
    }

    // Switch between tabs; load history when history tab is selected
    function switchTab(tabId) {
        document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if (tabId === 'history') {
            loadHistory();
        }
    }

    function logout() {
        fetch('/api/logout').finally(() => {
            window.location.href = 'login.html';
        });
    }

    // Poll every 5 seconds to keep dashboard up‑to‑date
    setInterval(loadDashboard, 5000);
    loadDashboard();
</script>
</body>
</html>
