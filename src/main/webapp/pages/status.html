<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Queue - LuxeSalon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: radial-gradient(circle at center, #1a1a1f 0%, #0a0a0c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            overflow: hidden;
        }

        .status-display {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .main-token {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 50px var(--primary-glow);
            animation: bounceIn 1s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .serving-header {
            font-size: 2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 1rem;
        }

        .queue-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            margin-top: 4rem;
        }

        .summary-box {
            background: var(--bg-glass);
            border: 1px solid var(--border-light);
            padding: 2rem;
            border-radius: 20px;
        }

        .summary-box h3 {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .summary-box .value {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .ticker {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--primary);
            color: #000;
            padding: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
        }
        .ticker-content {
            display: inline-block;
            animation: scroll 30s linear infinite;
        }
        @keyframes scroll {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="status-display">
        <div class="badge" style="margin-bottom: 2rem;">Now Serving</div>
        <div class="serving-header">Current Token</div>
        <div id="nowServing" class="main-token">TK-000</div>
        
        <div class="queue-summary">
            <div class="summary-box glass-card">
                <h3>Total Waiting</h3>
                <div id="waitingCount" class="value">0</div>
            </div>
            <div class="summary-box glass-card">
                <h3>Estimated Wait</h3>
                <div id="estWait" class="value">-- mins</div>
            </div>
        </div>
    </div>

    <div class="ticker">
        <div class="ticker-content">
            ✨ WELCOME TO LUXE SALON ✨ PLEASE TAKE A DIGITAL TOKEN FOR FASTER SERVICE ✨ NOW SERVING TK-001 ✨ ESTIMATED WAIT TIME IS APPROXIMATELY 15 MINUTES ✨ ENJOY OUR PREMIUM SERVICES ✨
        </div>
    </div>

    <script>
        async function fetchQueue() {
            try {
                const res = await fetch('/api/queue');
                const data = await res.json();
                
                const tokenEl = document.getElementById('nowServing');
                if (tokenEl.textContent !== data.nowServing) {
                    tokenEl.classList.remove('main-token');
                    void tokenEl.offsetWidth; // Trigger reflow
                    tokenEl.classList.add('main-token');
                    tokenEl.textContent = data.nowServing || 'NONE';
                }
                
                document.getElementById('waitingCount').textContent = data.totalWaiting || '0';
                document.getElementById('estWait').textContent = (data.totalWaiting * 15) + ' mins';
            } catch (err) {
                console.error(err);
            }
        }

        setInterval(fetchQueue, 5000);
        fetchQueue();
    </script>
</body>
</html>
